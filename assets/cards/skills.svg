<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Skills Window: Science Craft Tree">
<title>Skills — Science Craft Tree &amp; Spells</title>
<desc>Anime sci-fi skill tree window displaying Subrat Sahu's 6 mastered technical and scientific skill disciplines with animated scan beam.</desc>
<defs>
  <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070919" stop-opacity="0.96"/>
    <stop offset="100%" stop-color="#0d0822" stop-opacity="0.96"/>
  </linearGradient>
  <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#9d4edd" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    @keyframes sweepBeam {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(1350px); }
    }
    @keyframes chipPulse {
      0%, 100% { stroke-opacity: 0.5; }
      50% { stroke-opacity: 1; }
    }
    .beam { animation: sweepBeam 6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .chip-box { animation: chipPulse 4s ease-in-out infinite; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif; }
  </style>
</defs>

<!-- BASE CONTAINER -->
<rect x="25" y="15" width="1230" height="370" rx="10" fill="url(#panelBg)"/>
<rect x="25" y="15" width="1230" height="370" rx="10" fill="none" stroke="#9d4edd" stroke-width="1.8" filter="url(#glow)"/>

<!-- CORNER ACCENTS -->
<path d="M25 45 V15 H55" fill="none" stroke="#00f0ff" stroke-width="3.5"/>
<path d="M1255 45 V15 H1225" fill="none" stroke="#00f0ff" stroke-width="3.5"/>
<path d="M25 355 V385 H55" fill="none" stroke="#ffe600" stroke-width="3.5"/>
<path d="M1255 355 V385 H1225" fill="none" stroke="#ffe600" stroke-width="3.5"/>

<!-- HEADER STRIP -->
<rect x="25" y="15" width="1230" height="42" rx="10" fill="#9d4edd" fill-opacity="0.15"/>
<line x1="25" y1="57" x2="1255" y2="57" stroke="#9d4edd" stroke-opacity="0.5" stroke-width="1"/>
<text x="55" y="41" class="mono" font-size="13" fill="#00f0ff" font-weight="700" letter-spacing="2">
  ⟨ SKILLS MATRIX // SENKU LAB &amp; SOUL SOCIETY CRAFT TREE ⟩
</text>
<text x="1225" y="41" class="mono" font-size="12" fill="#00ff66" text-anchor="end" font-weight="600">
  6 / 6 SKILL DISCIPLINES MASTERED (100億% ACCURACY)
</text>

<!-- SCAN BEAM -->
<rect class="beam" x="0" y="58" width="220" height="326" fill="url(#beamGrad)"/>

<!-- SKILLS GRID: 3 COLUMNS x 2 ROWS -->
<g transform="translate(55, 75)">

  <!-- ROW 1, COL 1: PYTHON & SCIENCE -->
  <g transform="translate(0, 0)">
    <rect class="chip-box" x="0" y="0" width="365" height="135" rx="8" fill="#090f22" stroke="#00f0ff" stroke-width="1.2"/>
    <rect x="15" y="14" width="95" height="18" rx="3" fill="#00f0ff" fill-opacity="0.15"/>
    <text x="22" y="27" class="mono" font-size="10" fill="#00f0ff" font-weight="700">TREE 01 · 99%</text>
    <text x="15" y="56" class="sans" font-size="17" fill="#ffffff" font-weight="800">SCIENTIFIC COMPUTING</text>
    <text x="15" y="80" class="mono" font-size="12" fill="#00ff66">NumPy · SciPy · Pandas · Matplotlib</text>
    <text x="15" y="104" class="sans" font-size="12" fill="#7b82aa">Vectorized math, chemometrics &amp; data models</text>
    <rect x="15" y="118" width="335" height="4" rx="2" fill="#141a38"/>
    <rect x="15" y="118" width="330" height="4" rx="2" fill="#00ff66"/>
  </g>

  <!-- ROW 1, COL 2: AI SYSTEMS -->
  <g transform="translate(390, 0)">
    <rect class="chip-box" x="0" y="0" width="365" height="135" rx="8" fill="#090f22" stroke="#9d4edd" stroke-width="1.2"/>
    <rect x="15" y="14" width="95" height="18" rx="3" fill="#9d4edd" fill-opacity="0.2"/>
    <text x="22" y="27" class="mono" font-size="10" fill="#c77dff" font-weight="700">TREE 02 · 98%</text>
    <text x="15" y="56" class="sans" font-size="17" fill="#ffffff" font-weight="800">AUTONOMOUS AI SYSTEMS</text>
    <text x="15" y="80" class="mono" font-size="12" fill="#c77dff">Google Gemini · Groq · Agent Loops</text>
    <text x="15" y="104" class="sans" font-size="12" fill="#7b82aa">Tool use, multi-agent routing &amp; memory state</text>
    <rect x="15" y="118" width="335" height="4" rx="2" fill="#141a38"/>
    <rect x="15" y="118" width="320" height="4" rx="2" fill="#9d4edd"/>
  </g>

  <!-- ROW 1, COL 3: SPECTROSCOPY -->
  <g transform="translate(780, 0)">
    <rect class="chip-box" x="0" y="0" width="365" height="135" rx="8" fill="#090f22" stroke="#ffe600" stroke-width="1.2"/>
    <rect x="15" y="14" width="95" height="18" rx="3" fill="#ffe600" fill-opacity="0.15"/>
    <text x="22" y="27" class="mono" font-size="10" fill="#ffe600" font-weight="700">TREE 03 · 96%</text>
    <text x="15" y="56" class="sans" font-size="17" fill="#ffffff" font-weight="800">SPECLAB SIGNAL ENGINE</text>
    <text x="15" y="80" class="mono" font-size="12" fill="#ffe600">AsLS Baseline · Savitzky-Golay</text>
    <text x="15" y="104" class="sans" font-size="12" fill="#7b82aa">Raman/IR peak identification &amp; published on PyPI</text>
    <rect x="15" y="118" width="335" height="4" rx="2" fill="#141a38"/>
    <rect x="15" y="118" width="310" height="4" rx="2" fill="#ffe600"/>
  </g>

  <!-- ROW 2, COL 1: FULL STACK & CYBER -->
  <g transform="translate(0, 150)">
    <rect class="chip-box" x="0" y="0" width="365" height="135" rx="8" fill="#090f22" stroke="#00f0ff" stroke-width="1.2"/>
    <rect x="15" y="14" width="95" height="18" rx="3" fill="#00f0ff" fill-opacity="0.15"/>
    <text x="22" y="27" class="mono" font-size="10" fill="#00f0ff" font-weight="700">TREE 04 · 94%</text>
    <text x="15" y="56" class="sans" font-size="17" fill="#ffffff" font-weight="800">FULL-STACK &amp; CYBER DECK</text>
    <text x="15" y="80" class="mono" font-size="12" fill="#00f0ff">Streamlit · TypeScript · Web Audio</text>
    <text x="15" y="104" class="sans" font-size="12" fill="#7b82aa">High-tech Web Audio SFX, 3D Canvas, live portals</text>
    <rect x="15" y="118" width="335" height="4" rx="2" fill="#141a38"/>
    <rect x="15" y="118" width="295" height="4" rx="2" fill="#00f0ff"/>
  </g>

  <!-- ROW 2, COL 2: DEVOPS & INFRA -->
  <g transform="translate(390, 150)">
    <rect class="chip-box" x="0" y="0" width="365" height="135" rx="8" fill="#090f22" stroke="#ff0055" stroke-width="1.2"/>
    <rect x="15" y="14" width="95" height="18" rx="3" fill="#ff0055" fill-opacity="0.2"/>
    <text x="22" y="27" class="mono" font-size="10" fill="#ff0055" font-weight="700">TREE 05 · 92%</text>
    <text x="15" y="56" class="sans" font-size="17" fill="#ffffff" font-weight="800">CLOUD CITADEL &amp; DEVOPS</text>
    <text x="15" y="80" class="mono" font-size="12" fill="#ff0055">Docker · Railway · Linux · CI/CD</text>
    <text x="15" y="104" class="sans" font-size="12" fill="#7b82aa">Automated PyPI delivery, production containers</text>
    <rect x="15" y="118" width="335" height="4" rx="2" fill="#141a38"/>
    <rect x="15" y="118" width="285" height="4" rx="2" fill="#ff0055"/>
  </g>

  <!-- ROW 2, COL 3: STRATEGY & BANKAI -->
  <g transform="translate(780, 150)">
    <rect class="chip-box" x="0" y="0" width="365" height="135" rx="8" fill="#090f22" stroke="#c77dff" stroke-width="1.2"/>
    <rect x="15" y="14" width="105" height="18" rx="3" fill="#c77dff" fill-opacity="0.2"/>
    <text x="22" y="27" class="mono" font-size="10" fill="#c77dff" font-weight="700">TREE 06 · 100億%</text>
    <text x="15" y="56" class="sans" font-size="17" fill="#ffffff" font-weight="800">STRATEGY &amp; 卍解 PROTOCOL</text>
    <text x="15" y="80" class="mono" font-size="12" fill="#ffe600">Full Control Encounter · Kyōka Suigetsu</text>
    <text x="15" y="104" class="sans" font-size="12" fill="#7b82aa">Total foresight, Shiroe strategy, zero panic</text>
    <rect x="15" y="118" width="335" height="4" rx="2" fill="#141a38"/>
    <rect x="15" y="118" width="335" height="4" rx="2" fill="#c77dff"/>
  </g>

</g>

</svg>
