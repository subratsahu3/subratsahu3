<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Status Window: Subrat Sahu Character Sheet">
<title>Status Window — Subrat Sahu</title>
<desc>RPG anime status sheet displaying level, class, title, HP, MP, INT, STRAT, HYPNOSIS, and Scico attributes.</desc>
<defs>
  <linearGradient id="statusBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070919"/>
    <stop offset="100%" stop-color="#0e0722"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    @keyframes barGlow {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #00f0ff); }
    }
    .bar-glow { animation: barGlow 3s ease-in-out infinite; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .kanji { font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', 'Noto Sans JP', sans-serif; }
  </style>
</defs>

<!-- BASE CONTAINER -->
<rect x="25" y="15" width="1230" height="370" rx="10" fill="url(#statusBg)"/>
<rect x="25" y="15" width="1230" height="370" rx="10" fill="none" stroke="#9d4edd" stroke-width="1.8" filter="url(#glow)"/>

<!-- CORNER ACCENTS -->
<path d="M25 45 V15 H55" fill="none" stroke="#00f0ff" stroke-width="3.5"/>
<path d="M1255 45 V15 H1225" fill="none" stroke="#00f0ff" stroke-width="3.5"/>
<path d="M25 355 V385 H55" fill="none" stroke="#ffe600" stroke-width="3.5"/>
<path d="M1255 355 V385 H1225" fill="none" stroke="#ffe600" stroke-width="3.5"/>

<!-- HEADER STRIP -->
<rect x="25" y="15" width="1230" height="42" rx="10" fill="#9d4edd" fill-opacity="0.15"/>
<line x1="25" y1="57" x2="1255" y2="57" stroke="#9d4edd" stroke-opacity="0.5" stroke-width="1"/>
<text x="55" y="41" class="mono" font-size="13" fill="#00f0ff" font-weight="700" letter-spacing="2">
  ⟨ STATUS WINDOW // OPERATOR DOSSIER &amp; RPG ATTRIBUTES ⟩
</text>
<text x="1225" y="41" class="kanji" font-size="13" fill="#ffe600" text-anchor="end" font-weight="700">
  【 卍解 】 THE VILLAIN IN MASK · 10 BILLION %
</text>

<!-- LEFT COLUMN: OPERATOR PROFILE INFO -->
<g transform="translate(60, 85)">
  <rect x="0" y="0" width="460" height="260" rx="8" fill="#090f24" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1"/>
  
  <g transform="translate(25, 25)">
    <text x="0" y="12" class="mono" font-size="11" fill="#7b82aa">OPERATOR DESIGNATION</text>
    <text x="0" y="42" class="sans" font-size="26" fill="#ffffff" font-weight="900">
      Subrat Sahu <tspan fill="#ffe600" font-size="16">(Lv. 99)</tspan>
    </text>

    <!-- CLASS -->
    <text x="0" y="80" class="mono" font-size="12" fill="#7b82aa">CLASS</text>
    <text x="0" y="102" class="sans" font-size="15" fill="#00ff66" font-weight="700">
      S-Rank Rogue Alchemist &amp; AI Architect
    </text>

    <!-- TITLE -->
    <text x="0" y="132" class="mono" font-size="12" fill="#7b82aa">TITLE</text>
    <text x="0" y="154" class="sans" font-size="15" fill="#c77dff" font-weight="700">
      "The Villain in Mask" (仮面の策士)
    </text>

    <!-- AFFILIATION -->
    <text x="0" y="184" class="mono" font-size="12" fill="#7b82aa">AFFILIATION</text>
    <text x="0" y="206" class="sans" font-size="14" fill="#00f0ff">
      Kingdom of Science · Soul Society · Akiba
    </text>
  </g>
</g>

<!-- RIGHT COLUMN: STAT ATTRIBUTES BARS -->
<g transform="translate(560, 85)">
  <rect x="0" y="0" width="660" height="260" rx="8" fill="#090f24" stroke="#9d4edd" stroke-opacity="0.3" stroke-width="1"/>

  <g transform="translate(30, 25)">
    <!-- STAT 1: HP / REIATSU -->
    <text x="0" y="14" class="mono" font-size="12" fill="#c77dff" font-weight="700">HP (REIATSU PRESSURE)</text>
    <text x="600" y="14" class="mono" font-size="12" fill="#c77dff" text-anchor="end" font-weight="700">99,999 / 99,999</text>
    <rect x="0" y="22" width="600" height="8" rx="4" fill="#141a38"/>
    <rect class="bar-glow" x="0" y="22" width="600" height="8" rx="4" fill="#9d4edd"/>

    <!-- STAT 2: MP / DATABASE -->
    <text x="0" y="52" class="mono" font-size="12" fill="#00f0ff" font-weight="700">MP (DATABASE MEMORY)</text>
    <text x="600" y="52" class="mono" font-size="12" fill="#00f0ff" text-anchor="end" font-weight="700">∞</text>
    <rect x="0" y="60" width="600" height="8" rx="4" fill="#141a38"/>
    <rect class="bar-glow" x="0" y="60" width="600" height="8" rx="4" fill="#00f0ff"/>

    <!-- STAT 3: INT / SCIENCE -->
    <text x="0" y="90" class="mono" font-size="12" fill="#ffe600" font-weight="700">INT (100億% SCIENCE PRECISION)</text>
    <text x="600" y="90" class="mono" font-size="12" fill="#ffe600" text-anchor="end" font-weight="700">10,000,000,000%</text>
    <rect x="0" y="98" width="600" height="8" rx="4" fill="#141a38"/>
    <rect class="bar-glow" x="0" y="98" width="590" height="8" rx="4" fill="#ffe600"/>

    <!-- STAT 4: STRAT / SHIROE -->
    <text x="0" y="128" class="mono" font-size="12" fill="#00ff66" font-weight="700">STRAT (FULL CONTROL ENCOUNTER)</text>
    <text x="600" y="128" class="mono" font-size="12" fill="#00ff66" text-anchor="end" font-weight="700">MAX OVERCLOCK</text>
    <rect x="0" y="136" width="600" height="8" rx="4" fill="#141a38"/>
    <rect class="bar-glow" x="0" y="136" width="580" height="8" rx="4" fill="#00ff66"/>

    <!-- STAT 5: HYPNOSIS / AIZEN -->
    <text x="0" y="166" class="mono" font-size="12" fill="#ff0055" font-weight="700">HYPNOSIS (KYŌKA SUIGETSU DOMAIN)</text>
    <text x="600" y="166" class="mono" font-size="12" fill="#ff0055" text-anchor="end" font-weight="700">ABSOLUTE</text>
    <rect x="0" y="174" width="600" height="8" rx="4" fill="#141a38"/>
    <rect class="bar-glow" x="0" y="174" width="600" height="8" rx="4" fill="#ff0055"/>

    <!-- STAT 6: SCICO CHAOS FACTOR -->
    <text x="0" y="204" class="mono" font-size="12" fill="#ff9100" font-weight="700">SCICO FACTOR (CHAOTIC GENIUS)</text>
    <text x="600" y="204" class="mono" font-size="12" fill="#ff9100" text-anchor="end" font-weight="700">OVERLOAD</text>
    <rect x="0" y="212" width="600" height="8" rx="4" fill="#141a38"/>
    <rect class="bar-glow" x="0" y="212" width="560" height="8" rx="4" fill="#ff9100"/>
  </g>
</g>

<!-- FOOTER SYSTEM NOTIFICATION -->
<line x1="60" y1="355" x2="1220" y2="355" stroke="#9d4edd" stroke-opacity="0.3" stroke-width="1"/>
<text x="60" y="372" class="mono" font-size="11.5" fill="#7b82aa">
  LUCK ATTRIBUTE: 0.0% (Science demands no luck, only empirical execution and flawless code contracts.)
</text>
<text x="1220" y="372" class="mono" font-size="11.5" fill="#00ff66" text-anchor="end">
  SYSTEM INTEGRITY: OPTIMAL
</text>

</svg>
