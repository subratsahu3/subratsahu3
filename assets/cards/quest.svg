<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Daily Quest: Science and Strategy Directives">
<title>Daily Quest — Science &amp; Strategy Directives</title>
<desc>Anime RPG quest window listing Subrat Sahu's four active scientific and autonomous coding directives with animated checkmarks.</desc>
<defs>
  <linearGradient id="questBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070a1a"/>
    <stop offset="100%" stop-color="#0c071d"/>
  </linearGradient>
  <filter id="qGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    @keyframes checkTick {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseTag {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #ffe600); }
    }
    @keyframes scanVertical {
      0% { transform: translateY(0); }
      100% { transform: translateY(300px); }
    }
    .tick {
      stroke-dasharray: 24;
      animation: checkTick 1.2s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }
    .pulse-badge { animation: pulseTag 2.5s ease-in-out infinite; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .kanji { font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', 'Noto Sans JP', sans-serif; }
  </style>
</defs>

<!-- BASE CONTAINER -->
<rect x="25" y="15" width="1230" height="370" rx="10" fill="url(#questBg)"/>
<rect x="25" y="15" width="1230" height="370" rx="10" fill="none" stroke="#9d4edd" stroke-width="1.8" filter="url(#qGlow)"/>

<!-- CORNER ACCENTS -->
<path d="M25 45 V15 H55" fill="none" stroke="#00f0ff" stroke-width="3.5"/>
<path d="M1255 45 V15 H1225" fill="none" stroke="#00f0ff" stroke-width="3.5"/>
<path d="M25 355 V385 H55" fill="none" stroke="#00ff66" stroke-width="3.5"/>
<path d="M1255 355 V385 H1225" fill="none" stroke="#00ff66" stroke-width="3.5"/>

<!-- HEADER BAR -->
<rect x="25" y="15" width="1230" height="42" rx="10" fill="#9d4edd" fill-opacity="0.15"/>
<line x1="25" y1="57" x2="1255" y2="57" stroke="#9d4edd" stroke-opacity="0.5" stroke-width="1"/>
<text x="55" y="41" class="mono" font-size="13" fill="#00f0ff" font-weight="700" letter-spacing="2">
  ⟨ QUEST BOARD // AKIBA ROUND TABLE &amp; KINGDOM OF SCIENCE ⟩
</text>
<text x="1225" y="41" class="mono" font-size="12" fill="#00ff66" text-anchor="end" font-weight="600">
  STATUS: 3/4 COMPLETED (EXP: +10,000,000,000%)
</text>

<!-- MAIN TITLE -->
<text x="60" y="98" class="sans" font-size="22" fill="#ffffff" font-weight="800" letter-spacing="1">
  [DAILY QUEST: SCIENCE &amp; STRATEGY DIRECTIVES] HAS ARRIVED
</text>

<!-- QUEST ROWS -->
<g transform="translate(60, 120)">
  
  <!-- ROW 1: SPECLAB -->
  <g transform="translate(0, 0)">
    <!-- RANK BADGE -->
    <rect x="0" y="0" width="76" height="26" rx="4" fill="#ff0055" fill-opacity="0.2" stroke="#ff0055" stroke-width="1"/>
    <text x="38" y="18" class="mono" font-size="12" fill="#ff0055" text-anchor="middle" font-weight="700">S-RANK</text>
    
    <!-- CHECKBOX -->
    <rect x="96" y="2" width="22" height="22" rx="4" fill="#0d1428" stroke="#00f0ff" stroke-width="1.5"/>
    <path class="tick" d="M100 13 L106 19 L115 7" fill="none" stroke="#00ff66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- TEXT -->
    <text x="135" y="18" class="sans" font-size="16" fill="#ffffff" font-weight="600">
      SpecLab: Scientific IR &amp; Raman Spectroscopy Engine <tspan fill="#00f0ff" font-family="'Fira Code', monospace" font-size="13">(Published on PyPI v0.2.0)</tspan>
    </text>
    
    <!-- STATUS -->
    <text x="1140" y="18" class="mono" font-size="13" fill="#00ff66" text-anchor="end" font-weight="700">[COMPLETE ✓]</text>
  </g>

  <!-- ROW 2: AUTONOMOUS AGENT -->
  <g transform="translate(0, 56)">
    <!-- RANK BADGE -->
    <rect x="0" y="0" width="76" height="26" rx="4" fill="#9d4edd" fill-opacity="0.2" stroke="#9d4edd" stroke-width="1"/>
    <text x="38" y="18" class="mono" font-size="12" fill="#c77dff" text-anchor="middle" font-weight="700">A-RANK</text>
    
    <!-- CHECKBOX -->
    <rect x="96" y="2" width="22" height="22" rx="4" fill="#0d1428" stroke="#00f0ff" stroke-width="1.5"/>
    <path class="tick" d="M100 13 L106 19 L115 7" fill="none" stroke="#00ff66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- TEXT -->
    <text x="135" y="18" class="sans" font-size="16" fill="#ffffff" font-weight="600">
      Autonomous AI Agent Systems <tspan fill="#c77dff" font-family="'Fira Code', monospace" font-size="13">(Google Gemini API · Groq Cloud · Persistent Memory)</tspan>
    </text>
    
    <!-- STATUS -->
    <text x="1140" y="18" class="mono" font-size="13" fill="#00ff66" text-anchor="end" font-weight="700">[COMPLETE ✓]</text>
  </g>

  <!-- ROW 3: SPECTRAL BASELINE -->
  <g transform="translate(0, 112)">
    <!-- RANK BADGE -->
    <rect x="0" y="0" width="76" height="26" rx="4" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1"/>
    <text x="38" y="18" class="mono" font-size="12" fill="#00f0ff" text-anchor="middle" font-weight="700">A-RANK</text>
    
    <!-- CHECKBOX -->
    <rect x="96" y="2" width="22" height="22" rx="4" fill="#0d1428" stroke="#00f0ff" stroke-width="1.5"/>
    <path class="tick" d="M100 13 L106 19 L115 7" fill="none" stroke="#00ff66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- TEXT -->
    <text x="135" y="18" class="sans" font-size="16" fill="#ffffff" font-weight="600">
      Baseline Optimization &amp; Mathematics <tspan fill="#ffe600" font-family="'Fira Code', monospace" font-size="13">(AsLS Baseline Subtraction · Savitzky-Golay)</tspan>
    </text>
    
    <!-- STATUS -->
    <text x="1140" y="18" class="mono" font-size="13" fill="#00ff66" text-anchor="end" font-weight="700">[COMPLETE ✓]</text>
  </g>

  <!-- ROW 4: BANKAI DOMINION -->
  <g transform="translate(0, 168)">
    <!-- RANK BADGE -->
    <rect x="0" y="0" width="76" height="26" rx="4" fill="#ffe600" fill-opacity="0.2" stroke="#ffe600" stroke-width="1"/>
    <text x="38" y="18" class="mono" font-size="12" fill="#ffe600" text-anchor="middle" font-weight="700">S-RANK</text>
    
    <!-- CHECKBOX (ACTIVE IN PROGRESS) -->
    <rect x="96" y="2" width="22" height="22" rx="4" fill="#180e2d" stroke="#ff0055" stroke-width="1.5"/>
    <circle cx="107" cy="13" r="4" fill="#ffe600"/>
    
    <!-- TEXT -->
    <text x="135" y="18" class="sans" font-size="16" fill="#ffffff" font-weight="600">
      Soul Society Mastery &amp; Infinite Loop Elimination <tspan fill="#ff0055" font-family="'Fira Code', monospace" font-size="13">(Kyōka Suigetsu Bug-Free Runtime)</tspan>
    </text>
    
    <!-- STATUS -->
    <g class="pulse-badge">
      <rect x="990" y="2" width="150" height="24" rx="4" fill="#ff0055" fill-opacity="0.2" stroke="#ff0055" stroke-width="1"/>
      <text x="1065" y="18" class="mono" font-size="12" fill="#ffe600" text-anchor="middle" font-weight="700">【 卍解 99.9% 】</text>
    </g>
  </g>

</g>

<!-- FOOTER SYSTEM NOTIFICATION -->
<line x1="60" y1="345" x2="1220" y2="345" stroke="#9d4edd" stroke-opacity="0.3" stroke-width="1"/>
<text x="60" y="365" class="mono" font-size="12" fill="#7b82aa">
  QUEST REWARD: +10,000,000,000% EXP  ·  TITLE: "THE VILLAIN IN GLASSES"  ·  AIZEN REIATSU BOOST
</text>
<text x="1220" y="365" class="kanji" font-size="12" fill="#ffe600" text-anchor="end">
  唆るぜ、これは！ (100億% CRAFT METHOD)
</text>

</svg>
