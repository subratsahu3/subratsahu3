<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 125" width="1200" height="125" role="img" aria-label="agentops-platform">
<title>agentops-platform — Distributed AI Agent Orchestration</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#140b2a"/>
    <stop offset="60%" stop-color="#0a071c"/>
    <stop offset="100%" stop-color="#1a0c24"/>
  </linearGradient>
  <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    @keyframes hoverGlow {
      0%, 100% { stroke-opacity: 0.5; }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px #9d4edd); }
    }
    .card-border { animation: hoverGlow 4s ease-in-out infinite; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif; }
  </style>
</defs>

<rect class="card-border" x="2" y="2" width="1196" height="121" rx="8" fill="url(#bg)" stroke="#9d4edd" stroke-width="1.6"/>
<path d="M2 25 V2 H25" fill="none" stroke="#c77dff" stroke-width="3"/>
<path d="M1198 25 V2 H1175" fill="none" stroke="#c77dff" stroke-width="3"/>
<path d="M2 100 V123 H25" fill="none" stroke="#9d4edd" stroke-width="3"/>
<path d="M1198 100 V123 H1175" fill="none" stroke="#9d4edd" stroke-width="3"/>

<!-- BADGE TAGS -->
<rect x="25" y="16" width="75" height="20" rx="3" fill="#9d4edd" fill-opacity="0.2"/>
<text x="62" y="30" class="mono" font-size="10.5" fill="#c77dff" text-anchor="middle" font-weight="700">S-RANK</text>

<rect x="110" y="16" width="135" height="20" rx="3" fill="#9d4edd" fill-opacity="0.15" stroke="#9d4edd" stroke-width="0.8"/>
<text x="177" y="30" class="mono" font-size="10.5" fill="#c77dff" text-anchor="middle" font-weight="700">AUTONOMOUS ORCH</text>

<text x="260" y="30" class="mono" font-size="11" fill="#7b82aa">Multi-Agent Systems · Dynamic Cost-Routing · HITL Safety · Evals</text>

<!-- TITLE -->
<text x="25" y="65" class="sans" font-size="21" fill="#ffffff" font-weight="900" letter-spacing="0.5">
  🤖 agentops-platform
</text>

<!-- DESCRIPTION -->
<text x="25" y="90" class="sans" font-size="13" fill="#a4b0d4">
  Production-grade distributed AI agent orchestration platform with dynamic cost-routing, telemetry, and human-in-the-loop safety gates.
</text>

<!-- EXPLORE ARROW -->
<rect x="990" y="42" width="185" height="38" rx="6" fill="#9d4edd" fill-opacity="0.14" stroke="#9d4edd" stroke-width="1"/>
<text x="1082" y="66" class="mono" font-size="12" fill="#c77dff" text-anchor="middle" font-weight="700">
  EXPLORE ARTIFACT →
</text>
</svg>
