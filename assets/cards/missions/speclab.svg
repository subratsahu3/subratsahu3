<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 125" width="1200" height="125" role="img" aria-label="SpecLab-Spectrum-Analyzer">
<title>SpecLab-Spectrum-Analyzer — PyPI Published</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0a1226"/>
    <stop offset="60%" stop-color="#070a1a"/>
    <stop offset="100%" stop-color="#0e0c28"/>
  </linearGradient>
  <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    @keyframes hoverGlow {
      0%, 100% { stroke-opacity: 0.5; }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px #00f0ff); }
    }
    .card-border { animation: hoverGlow 4s ease-in-out infinite; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif; }
  </style>
</defs>

<rect class="card-border" x="2" y="2" width="1196" height="121" rx="8" fill="url(#bg)" stroke="#00f0ff" stroke-width="1.6"/>
