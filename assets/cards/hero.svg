<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-label="System Window: Supreme Scientific Strategist Awakened — Subrat Sahu">
<title>System Window — Subrat Sahu Awakened</title>
<desc>High-tech HUD system alert window displaying Subrat Sahu's stats, anime masteries, and skills.</desc>
<defs>
  <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0818" stop-opacity="0.96"/>
    <stop offset="60%" stop-color="#100d28" stop-opacity="0.94"/>
    <stop offset="100%" stop-color="#070a1e" stop-opacity="0.96"/>
  </linearGradient>
  <linearGradient id="neonBorder" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9d4edd"/>
    <stop offset="35%" stop-color="#00f0ff"/>
    <stop offset="70%" stop-color="#c77dff"/>
    <stop offset="100%" stop-color="#ffe600"/>
  </linearGradient>
  <radialGradient id="emblemAura" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.5"/>
    <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    @keyframes pulseAura {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes spinRings {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.7; }
      100% { transform: translateY(-380px); opacity: 0; }
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .p-glow { animation: floatParticle ease-in-out infinite; }
    .aura-circle { transform-origin: 1080px 220px; animation: pulseAura 4s ease-in-out infinite; }
    .ring-rotate { transform-origin: 1080px 220px; animation: spinRings 24s linear infinite; }
    .cursor { animation: blinkCursor 0.9s infinite; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .kanji { font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', 'Noto Sans JP', sans-serif; }
  </style>
</defs>

<!-- BASE CONTAINER -->
<rect x="20" y="15" width="1240" height="400" rx="10" fill="url(#panelBg)"/>
<rect x="20" y="15" width="1240" height="400" rx="10" fill="none" stroke="url(#neonBorder)" stroke-width="1.8" filter="url(#cardGlow)"/>

<!-- CORNER HUD BRACKETS -->
<path d="M20 50 V15 H55" fill="none" stroke="#00f0ff" stroke-width="4"/>
<path d="M1260 50 V15 H1225" fill="none" stroke="#00f0ff" stroke-width="4"/>
<path d="M20 380 V415 H55" fill="none" stroke="#ffe600" stroke-width="4"/>
<path d="M1260 380 V415 H1225" fill="none" stroke="#ffe600" stroke-width="4"/>

<!-- HEADER STRIP -->
<rect x="20" y="15" width="1240" height="46" rx="10" fill="#9d4edd" fill-opacity="0.14"/>
<line x1="20" y1="61" x2="1260" y2="61" stroke="#9d4edd" stroke-opacity="0.5" stroke-width="1.2"/>
<circle cx="50" cy="38" r="6" fill="#00ff66"/>
<text x="75" y="43" class="mono" font-size="14" fill="#00f0ff" font-weight="700" letter-spacing="2">
  [ SYSTEM ALERT: SUPREME SCIENTIST &amp; MASTER STRATEGIST AWAKENED ]
</text>
<text x="1225" y="43" class="mono" font-size="12" fill="#ffe600" text-anchor="end" font-weight="600">
  CLEARANCE: S-RANK OVERSEER
</text>

<!-- PARTICLES -->
<g fill="#9d4edd">
  <circle class="p-glow" cx="150" cy="400" r="2" style="animation-duration: 8s; animation-delay: 0.5s;"/>
  <circle class="p-glow" cx="420" cy="400" r="2.5" style="animation-duration: 7s; animation-delay: 2.2s;"/>
  <circle class="p-glow" cx="720" cy="400" r="1.5" style="animation-duration: 9s; animation-delay: 1.1s;"/>
</g>
<g fill="#00f0ff">
  <circle class="p-glow" cx="280" cy="400" r="2" style="animation-duration: 6.5s; animation-delay: 1.8s;"/>
  <circle class="p-glow" cx="590" cy="400" r="2" style="animation-duration: 8.5s; animation-delay: 0.2s;"/>
  <circle class="p-glow" cx="890" cy="400" r="2.5" style="animation-duration: 7.2s; animation-delay: 3s;"/>
</g>

<!-- LEFT COLUMN: OPERATOR ATTRIBUTES -->
<g transform="translate(60, 95)">
  <!-- NAME & CALLSIGN -->
  <text x="0" y="10" class="mono" font-size="13" fill="#c77dff" font-weight="600" letter-spacing="1">OPERATOR IDENTITY</text>
  <text x="0" y="42" class="sans" font-size="28" fill="#ffffff" font-weight="900" letter-spacing="1">
    Subrat Sahu <tspan fill="#00f0ff" font-size="19" font-family="'Fira Code', monospace">(@subratsahu3)</tspan>
  </text>
  
  <!-- ATTRIBUTE TABLE -->
  <g transform="translate(0, 68)" class="mono" font-size="14">
    <!-- ROW 1 -->
    <text x="0" y="20" fill="#7b82aa">CLASS DESIGNATION</text>
    <text x="230" y="20" fill="#00ff66" font-weight="700">S-Rank Rogue Alchemist &amp; Autonomous AI Strategist</text>

    <!-- ROW 2 -->
    <text x="0" y="52" fill="#7b82aa">ANIME ALIGNMENT</text>
    <text x="230" y="52" fill="#ffe600" font-weight="600">Bleach (藍染 惣右介) × Log Horizon (腹ぐろ眼鏡) × Dr. STONE (Senku)</text>

    <!-- ROW 3 -->
    <text x="0" y="84" fill="#7b82aa">GUILD &amp; DOMAIN</text>
    <text x="230" y="84" fill="#ffffff">Soul Society // Akiba Round Table // Kingdom of Science</text>

    <!-- ROW 4 -->
    <text x="0" y="116" fill="#7b82aa">CORE CREATIONS</text>
    <text x="230" y="116" fill="#00f0ff" font-weight="600">SpecLab (IR/Raman on PyPI) · Autonomous Agents · Neural Deck v3.0</text>

    <!-- ROW 5 -->
    <text x="0" y="148" fill="#7b82aa">PASSIVE ABILITY</text>
    <text x="230" y="148" fill="#c77dff">Full Control Encounter (Simulates bugs 1,000 steps in advance)</text>

    <!-- ROW 6 -->
    <text x="0" y="180" fill="#7b82aa">ULTIMATE MOVE</text>
    <text x="230" y="180" fill="#ff0055" font-weight="800">【 卍 解 】 B A N - K A I  &amp;  100億% Scientific Precision</text>
  </g>
</g>

<!-- RIGHT COLUMN: HOLOGRAPHIC GUILD SEAL / HOGYOKU AURA -->
<g transform="translate(0, 0)">
  <ellipse class="aura-circle" cx="1080" cy="225" rx="140" ry="140" fill="url(#emblemAura)"/>
  
  <!-- ROTATING TECH RINGS -->
  <g class="ring-rotate">
    <circle cx="1080" cy="225" r="95" fill="none" stroke="#9d4edd" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.8"/>
    <circle cx="1080" cy="225" r="115" fill="none" stroke="#00f0ff" stroke-width="1.4" stroke-dasharray="14 10 4 10" opacity="0.65"/>
    <circle cx="1080" cy="225" r="75" fill="none" stroke="#ffe600" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/>
  </g>

  <!-- INNER CORE SYMBOL -->
  <circle cx="1080" cy="225" r="55" fill="#0c0e24" stroke="#00f0ff" stroke-width="2" filter="url(#cardGlow)"/>
  <text x="1080" y="215" class="kanji" font-size="28" fill="#ffe600" text-anchor="middle" font-weight="900" filter="url(#cardGlow)">卍解</text>
  <text x="1080" y="240" class="mono" font-size="11" fill="#00ff66" text-anchor="middle" font-weight="700">100億%</text>

  <!-- BADGE SUB-LABEL -->
  <rect x="990" y="325" width="180" height="24" rx="4" fill="#080c1e" stroke="#9d4edd" stroke-width="1"/>
  <text x="1080" y="341" class="mono" font-size="10.5" fill="#00f0ff" text-anchor="middle" font-weight="700">KYŌKA SUIGETSU ENGINE</text>
</g>

<!-- BOTTOM TELEMETRY BAR -->
<rect x="60" y="365" width="860" height="26" rx="4" fill="#080c1e" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1"/>
<text x="75" y="382" class="mono" font-size="12" fill="#00ff66">
  &gt; SYSTEM LOAD: 100億% NORMAL // SOUL PRESSURE: MAXIMUM // "YARE YARE..."<tspan class="cursor" fill="#00f0ff">_</tspan>
</text>

</svg>
