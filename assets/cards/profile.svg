<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Operator Profile &amp; Scico Philosophy">
<title>Operator Profile &amp; Scico Philosophy — Subrat Sahu</title>
<desc>Anime style dossier displaying Subrat Sahu's persona, life philosophy, rules, and quotes from Senku, Shiroe, and Aizen.</desc>
<defs>
  <linearGradient id="profileBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070919"/>
    <stop offset="100%" stop-color="#0c071d"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    @keyframes textGlow {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #00f0ff); }
    }
    .glow-line { animation: textGlow 3.5s ease-in-out infinite; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .kanji { font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', 'Noto Sans JP', sans-serif; }
  </style>
</defs>

<!-- BASE CONTAINER -->
<rect x="25" y="15" width="1230" height="310" rx="10" fill="url(#profileBg)"/>
<rect x="25" y="15" width="1230" height="310" rx="10" fill="none" stroke="#9d4edd" stroke-width="1.8" filter="url(#glow)"/>

<!-- CORNER ACCENTS -->
<path d="M25 45 V15 H55" fill="none" stroke="#00f0ff" stroke-width="3.5"/>
<path d="M1255 45 V15 H1225" fill="none" stroke="#00f0ff" stroke-width="3.5"/>
<path d="M25 295 V325 H55" fill="none" stroke="#ffe600" stroke-width="3.5"/>
<path d="M1255 295 V325 H1225" fill="none" stroke="#ffe600" stroke-width="3.5"/>

<!-- HEADER STRIP -->
<rect x="25" y="15" width="1230" height="42" rx="10" fill="#9d4edd" fill-opacity="0.15"/>
<line x1="25" y1="57" x2="1255" y2="57" stroke="#9d4edd" stroke-opacity="0.5" stroke-width="1"/>
<text x="55" y="41" class="mono" font-size="13" fill="#00f0ff" font-weight="700" letter-spacing="2">
  ⟨ OPERATOR DOSSIER // SCICO CREED &amp; PHILOSOPHY ⟩
</text>
<text x="1225" y="41" class="mono" font-size="12" fill="#ffe600" text-anchor="end" font-weight="600">
  "SOLITUDE IS PEACE 🌑"
</text>

<!-- CONTENT SPLIT: LEFT LORE & RIGHT QUOTES -->
<g transform="translate(60, 80)">

  <!-- LEFT BOX: LIFE AXIOMS -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="530" height="200" rx="8" fill="#090f24" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1"/>
    
    <g transform="translate(25, 20)">
      <text x="0" y="12" class="mono" font-size="11" fill="#7b82aa">OPERATOR AXIOMS</text>
      
      <text x="0" y="40" class="sans" font-size="16" fill="#ffffff" font-weight="700">
        🔭 Exploring the Universe &amp; Cutting-Edge Tech.
      </text>

      <text x="0" y="68" class="sans" font-size="16" fill="#ff0055" font-weight="800">
        😈 Scico. <tspan fill="#00f0ff" font-weight="600">🎵 Audiophile.</tspan>
      </text>

      <text x="0" y="98" class="mono" font-size="14" fill="#ff0055">
        🚫 3D Girls = Syntax Error
      </text>

      <text x="0" y="124" class="mono" font-size="14" fill="#00ff66" font-weight="700">
        ⛩️ 2D Waifus = Compiled Successfully
      </text>

      <text x="0" y="152" class="mono" font-size="14" fill="#c77dff">
        🚶‍♂️ Solitude is peace. 🌑
      </text>
    </g>
  </g>

  <!-- RIGHT BOX: THE MASTERMINDS' TRINITY QUOTE -->
  <g transform="translate(560, 0)">
    <rect x="0" y="0" width="600" height="200" rx="8" fill="#090f24" stroke="#9d4edd" stroke-opacity="0.3" stroke-width="1"/>

    <g transform="translate(25, 20)">
      <text x="0" y="12" class="mono" font-size="11" fill="#7b82aa">MASTERMINDS' TRINITY</text>

      <!-- SHIROE -->
      <text x="0" y="38" class="sans" font-size="13" fill="#00f0ff" font-weight="600">
        "Database, database! If this world has rules, we will learn them. If it doesn't, we will write the contracts ourselves."
      </text>
      <text x="0" y="55" class="mono" font-size="11" fill="#7b82aa">
        ― Shiroe // The Villain in Glasses (腹ぐろ眼鏡)
      </text>

      <!-- SENKU -->
      <text x="0" y="85" class="sans" font-size="13" fill="#00ff66" font-weight="600">
        "Science doesn't lie. Step by step, we craft the civilization of tomorrow. 10 billion percent exhilarating!"
      </text>
      <text x="0" y="102" class="mono" font-size="11" fill="#7b82aa">
        ― Senku Ishigami // Kingdom of Science (唆るぜ、これは！)
      </text>

      <!-- AIZEN -->
      <text x="0" y="132" class="sans" font-size="13" fill="#ffe600" font-weight="600">
        "No one stands on top from the beginning... but that unbearable vacancy shall end. From now on, I will stand at the top."
      </text>
      <text x="0" y="149" class="mono" font-size="11" fill="#7b82aa">
        ― Sōsuke Aizen // Bleach Soul Society (藍染 惣右介)
      </text>

      <!-- GLASSES ADJUSTMENT -->
      <text x="550" y="150" class="mono glow-line" font-size="12" fill="#00f0ff" text-anchor="end">
        *Pushes glasses up* 👓⚡
      </text>
    </g>
  </g>

</g>

<!-- FOOTER SYSTEM NOTIFICATION -->
<line x1="60" y1="295" x2="1220" y2="295" stroke="#9d4edd" stroke-opacity="0.3" stroke-width="1"/>
<text x="60" y="312" class="mono" font-size="11" fill="#7b82aa">
  PROTOCOL STATUS: SCICO INTELLECT ACTIVE // 0% CONFORMITY // 100% INDEPENDENT LOGIC
</text>
<text x="1220" y="312" class="kanji" font-size="11" fill="#00ff66" text-anchor="end">
  科学の力は無限大 (POWER OF SCIENCE IS BOUNDLESS)
</text>

</svg>
