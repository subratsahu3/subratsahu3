<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 230" width="1280" height="230" role="img" aria-label="Comms &amp; Guild Channels — Subrat Sahu">
<title>Comms &amp; Guild Channels — Subrat Sahu</title>
<desc>Futuristic communication frequency matrix linking to Subrat Sahu's Portfolio, GitHub, PyPI, Email, and LinkedIn.</desc>
<defs>
  <linearGradient id="commBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070919"/>
    <stop offset="100%" stop-color="#0c071d"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    @keyframes chipPulse {
      0%, 100% { stroke-opacity: 0.5; }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #00f0ff); }
    }
    .comm-chip { animation: chipPulse 4s ease-in-out infinite; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif; }
  </style>
</defs>

<!-- BASE CONTAINER -->
<rect x="25" y="15" width="1230" height="200" rx="10" fill="url(#commBg)"/>
<rect x="25" y="15" width="1230" height="200" rx="10" fill="none" stroke="#9d4edd" stroke-width="1.8" filter="url(#glow)"/>

<!-- CORNER ACCENTS -->
<path d="M25 45 V15 H55" fill="none" stroke="#00f0ff" stroke-width="3.5"/>
<path d="M1255 45 V15 H1225" fill="none" stroke="#00f0ff" stroke-width="3.5"/>
<path d="M25 185 V215 H55" fill="none" stroke="#ffe600" stroke-width="3.5"/>
<path d="M1255 185 V215 H1225" fill="none" stroke="#ffe600" stroke-width="3.5"/>

<!-- HEADER STRIP -->
<rect x="25" y="15" width="1230" height="42" rx="10" fill="#9d4edd" fill-opacity="0.15"/>
<line x1="25" y1="57" x2="1255" y2="57" stroke="#9d4edd" stroke-opacity="0.5" stroke-width="1"/>
<text x="55" y="41" class="mono" font-size="13" fill="#00f0ff" font-weight="700" letter-spacing="2">
  ⟨ TRANSMISSION BEACONS // GUILD CHANNELS &amp; CONTACT FREQUENCIES ⟩
</text>
<text x="1225" y="41" class="mono" font-size="12" fill="#00ff66" text-anchor="end" font-weight="600">
  ALL RELAYS OPEN // 24/7 ENCRYPTION
</text>

<!-- 5 INTERACTIVE TRANSMISSION CHIPS -->
<g transform="translate(55, 80)">

  <!-- 1. PORTFOLIO -->
  <g transform="translate(0, 0)">
    <rect class="comm-chip" x="0" y="0" width="220" height="80" rx="8" fill="#090f24" stroke="#00f0ff" stroke-width="1.3"/>
    <text x="20" y="28" class="mono" font-size="10" fill="#00f0ff" font-weight="700">CYBER DECK PORTAL</text>
    <text x="20" y="52" class="sans" font-size="15" fill="#ffffff" font-weight="800">Portfolio Website</text>
    <text x="20" y="68" class="mono" font-size="10.5" fill="#7b82aa">subratsahu3.github.io</text>
  </g>

  <!-- 2. GITHUB -->
  <g transform="translate(238, 0)">
    <rect class="comm-chip" x="0" y="0" width="220" height="80" rx="8" fill="#090f24" stroke="#c77dff" stroke-width="1.3"/>
    <text x="20" y="28" class="mono" font-size="10" fill="#c77dff" font-weight="700">CODE ARCHIVE</text>
    <text x="20" y="52" class="sans" font-size="15" fill="#ffffff" font-weight="800">GitHub Profile</text>
    <text x="20" y="68" class="mono" font-size="10.5" fill="#7b82aa">@subratsahu3</text>
  </g>

  <!-- 3. PYPI -->
  <g transform="translate(476, 0)">
    <rect class="comm-chip" x="0" y="0" width="220" height="80" rx="8" fill="#090f24" stroke="#ffe600" stroke-width="1.3"/>
    <text x="20" y="28" class="mono" font-size="10" fill="#ffe600" font-weight="700">PYTHON REGISTRY</text>
    <text x="20" y="52" class="sans" font-size="15" fill="#ffffff" font-weight="800">PyPI Repository</text>
    <text x="20" y="68" class="mono" font-size="10.5" fill="#7b82aa">speclab-spectrum-analyzer</text>
  </g>

  <!-- 4. EMAIL -->
  <g transform="translate(714, 0)">
    <rect class="comm-chip" x="0" y="0" width="220" height="80" rx="8" fill="#090f24" stroke="#00ff66" stroke-width="1.3"/>
    <text x="20" y="28" class="mono" font-size="10" fill="#00ff66" font-weight="700">SECURE COMMS</text>
    <text x="20" y="52" class="sans" font-size="15" fill="#ffffff" font-weight="800">Direct Email</text>
    <text x="20" y="68" class="mono" font-size="10.5" fill="#7b82aa">subratsahu195@gmail.com</text>
  </g>

  <!-- 5. LINKEDIN -->
  <g transform="translate(952, 0)">
    <rect class="comm-chip" x="0" y="0" width="220" height="80" rx="8" fill="#090f24" stroke="#ff0055" stroke-width="1.3"/>
    <text x="20" y="28" class="mono" font-size="10" fill="#ff0055" font-weight="700">PROFESSIONAL GRID</text>
    <text x="20" y="52" class="sans" font-size="15" fill="#ffffff" font-weight="800">LinkedIn Connect</text>
    <text x="20" y="68" class="mono" font-size="10.5" fill="#7b82aa">in/subratsahu3</text>
  </g>

</g>

<!-- FOOTER SYSTEM NOTIFICATION -->
<line x1="60" y1="180" x2="1220" y2="180" stroke="#9d4edd" stroke-opacity="0.3" stroke-width="1"/>
<text x="640" y="196" class="mono" font-size="11.5" fill="#7b82aa" text-anchor="middle">
  "ようこそ、私の尸魂界へ。Rebuilding Civilization from 0 to 1 with 10 Billion Percent Precision."
</text>

</svg>
