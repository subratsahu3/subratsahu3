<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Bleach Sōsuke Aizen Japanese Creed — Soul Society">
<title>Bleach Sōsuke Aizen Creed — Kyōka Suigetsu</title>
<desc>Soul Society calligraphy window featuring Aizen Sōsuke's iconic dialogues and Bankai invocation in Japanese and English.</desc>
<defs>
  <linearGradient id="creedBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070614"/>
    <stop offset="50%" stop-color="#120c2b"/>
    <stop offset="100%" stop-color="#080816"/>
  </linearGradient>
  <linearGradient id="goldCalligraphy" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ffe600"/>
    <stop offset="50%" stop-color="#ffd000"/>
    <stop offset="100%" stop-color="#ff9100"/>
  </linearGradient>
  <linearGradient id="bladeGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#c77dff" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.2"/>
  </linearGradient>
  <filter id="creedGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    @keyframes bladePulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes kanjiShimmer {
      0%, 100% { opacity: 0.92; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #ffe600); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0; }
      25% { opacity: 0.8; }
      75% { opacity: 0.6; }
      100% { transform: translateY(-300px); opacity: 0; }
    }
    .p-creed { animation: floatParticle ease-in-out infinite; }
    .blade { animation: bladePulse 3.5s ease-in-out infinite; }
    .shimmer { animation: kanjiShimmer 4s ease-in-out infinite; }
    .kanji-big { font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', 'Noto Sans JP', 'Yu Gothic', sans-serif; font-weight: 900; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif; }
  </style>
</defs>

<!-- BACKGROUND PANEL -->
<rect x="20" y="15" width="1240" height="310" rx="10" fill="url(#creedBg)"/>
<rect x="20" y="15" width="1240" height="310" rx="10" fill="none" stroke="#9d4edd" stroke-width="1.6" filter="url(#creedGlow)"/>

<!-- SHATTERED MIRROR HAIRLINE ACCENTS (KYŌKA SUIGETSU ILLUSION) -->
<path d="M40 30 L110 90 L85 140 L160 170" fill="none" stroke="#00f0ff" stroke-width="0.7" opacity="0.4"/>
<path d="M1200 290 L1140 240 L1170 190 L1100 150" fill="none" stroke="#00f0ff" stroke-width="0.7" opacity="0.4"/>
<path d="M1180 40 L1120 80 L1150 120" fill="none" stroke="#c77dff" stroke-width="0.6" opacity="0.4"/>

<!-- SPIRITUAL PARTICLES -->
<g fill="#c77dff">
  <circle class="p-creed" cx="190" cy="300" r="2" style="animation-duration: 6s; animation-delay: 0.2s;"/>
  <circle class="p-creed" cx="480" cy="300" r="1.5" style="animation-duration: 7.5s; animation-delay: 1.8s;"/>
  <circle class="p-creed" cx="820" cy="300" r="2.5" style="animation-duration: 6.8s; animation-delay: 0.9s;"/>
  <circle class="p-creed" cx="1080" cy="300" r="2" style="animation-duration: 8s; animation-delay: 2.5s;"/>
</g>

<!-- CORNER BRACKETS -->
<path d="M20 45 V15 H50" fill="none" stroke="#ff0055" stroke-width="3.5"/>
<path d="M1260 45 V15 H1230" fill="none" stroke="#ff0055" stroke-width="3.5"/>
<path d="M20 295 V325 H50" fill="none" stroke="#00f0ff" stroke-width="3.5"/>
<path d="M1260 295 V325 H1230" fill="none" stroke="#00f0ff" stroke-width="3.5"/>

<!-- HEADER STRIP -->
<rect x="20" y="15" width="1240" height="40" rx="10" fill="#9d4edd" fill-opacity="0.2"/>
<line x1="20" y1="55" x2="1260" y2="55" stroke="#9d4edd" stroke-opacity="0.6" stroke-width="1"/>
<text x="50" y="40" class="mono" font-size="13" fill="#00f0ff" font-weight="700" letter-spacing="2">
  ⟨ BLEACH // AIZEN SŌSUKE CREED &amp; ZANPAKUTŌ KYŌKA SUIGETSU ⟩
</text>
<text x="1230" y="40" class="kanji-big" font-size="15" fill="#ff0055" text-anchor="end" font-weight="900">
  藍染 惣右介 · 鏡花水月
</text>

<!-- LEFT SIDE: VERTICAL ZANPAKUTŌ BLADE & BANKAI STAMP -->
<g transform="translate(60, 75)">
  <!-- GLOWING BLADE LINE -->
  <line class="blade" x1="20" y1="10" x2="20" y2="215" stroke="url(#bladeGrad)" stroke-width="3.5" filter="url(#creedGlow)"/>
  <circle cx="20" cy="10" r="4" fill="#00f0ff" filter="url(#creedGlow)"/>
  
  <!-- BANKAI CALLIGRAPHY BADGE -->
  <rect x="45" y="30" width="70" height="150" rx="6" fill="#140b28" stroke="#ff0055" stroke-width="1.8" filter="url(#creedGlow)"/>
  <text x="80" y="70" class="kanji-big" font-size="28" fill="#ffe600" text-anchor="middle" font-weight="900">卍</text>
  <text x="80" y="108" class="kanji-big" font-size="28" fill="#ffe600" text-anchor="middle" font-weight="900">解</text>
  <text x="80" y="138" class="mono" font-size="10" fill="#00f0ff" text-anchor="middle" font-weight="700">BAN-KAI</text>
  <text x="80" y="160" class="mono" font-size="9" fill="#ff0055" text-anchor="middle">RELEASE</text>
</g>

<!-- RIGHT SIDE: DIALOGUES -->
<g transform="translate(200, 75)">
  <!-- DIALOGUE 1: YOKOSO WATASHI NO SOUL SOCIETY -->
  <g class="shimmer">
    <text x="0" y="24" class="kanji-big" font-size="21" fill="url(#goldCalligraphy)">
      「やれやれ… ようこそ、私の尸魂界（ソウル・ソサエティ）へ」
    </text>
  </g>
  <text x="0" y="45" class="mono" font-size="13" fill="#00f0ff">
    "Yare yare... Yokoso, watashi no Sōru Sosaeti e." <tspan fill="#7b82aa">― (Good grief... Welcome to my Soul Society.)</tspan>
  </text>

  <!-- DIVIDER -->
  <line x1="0" y1="62" x2="1020" y2="62" stroke="#9d4edd" stroke-opacity="0.25" stroke-width="1"/>

  <!-- DIALOGUE 2: ADMIRATION & UNDERSTANDING -->
  <text x="0" y="90" class="kanji-big" font-size="19" fill="#ffffff">
    「憧れは、理解から最も遠い感情だよ」
  </text>
  <text x="0" y="111" class="mono" font-size="13" fill="#00ff66">
    "Admiration is the emotion furthest from understanding." <tspan fill="#7b82aa">― Truth of the Sovereign Mind</tspan>
  </text>

  <!-- DIVIDER -->
  <line x1="0" y1="128" x2="1020" y2="128" stroke="#9d4edd" stroke-opacity="0.25" stroke-width="1"/>

  <!-- DIALOGUE 3: KYOKA SUIGETSU COMPLETE HYPNOSIS -->
  <text x="0" y="156" class="kanji-big" font-size="19" fill="#c77dff">
    「一体いつから――鏡花水月を使っていないと錯覚していた？」
  </text>
  <text x="0" y="177" class="mono" font-size="13" fill="#ffd000">
    "Since when were you under the impression that you were not under my Kyōka Suigetsu?"
  </text>

  <!-- FOOTER TRIGGER -->
  <g transform="translate(0, 206)">
    <rect x="0" y="0" width="310" height="26" rx="4" fill="#ff0055" fill-opacity="0.15" stroke="#ff0055" stroke-width="1"/>
    <text x="12" y="17" class="kanji-big" font-size="13" fill="#ffe600">「砕けろ、鏡花水月」</text>
    <text x="140" y="17" class="mono" font-size="12" fill="#00f0ff" font-weight="700">SHATTER, KYŌKA SUIGETSU</text>

    <text x="1020" y="17" class="mono" font-size="12" fill="#7b82aa" text-anchor="end">
      Aizen Sōsuke Philosophy Archive // Bankai Sovereign Edition
    </text>
  </g>
</g>

</svg>
